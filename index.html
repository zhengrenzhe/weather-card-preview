<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气卡片云贴图样稿</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: #e8ecf2;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: radial-gradient(1100px 620px at 18% 8%, #45566b 0%, transparent 60%), radial-gradient(900px 600px at 85% 90%, #3a3550 0%, transparent 55%), linear-gradient(160deg, #1b2430, #262f3d 45%, #12171f);
  background-attachment: fixed;
}
.bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 20px; background: rgba(16, 20, 27, .82); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, .08); font-size: 13px; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > .label { color: #9aa6b6; margin-right: 2px; }
.chip { border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .04); color: #dfe5ee; border-radius: 999px; padding: 4px 10px; font: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { background: #e8ecf2; color: #10141b; border-color: #e8ecf2; }
main { padding: 24px 20px 60px; }
.stage { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.stat { font-size: 12px; color: #8793a3; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.src { font-size: 12px; color: #8793a3; margin: 4px 0 0; }
h2 { font-size: 15px; font-weight: 500; color: #c9d2de; margin: 36px 0 12px; }
.gallery { display: flex; flex-wrap: wrap; gap: 16px; }
figure { margin: 0; }
figcaption { font-size: 13px; color: #aab5c4; margin: 8px 0 0; }
.card { position: relative; overflow: hidden; border-radius: 24px; corner-shape: superellipse(1.2); isolation: isolate; color: #fff; background: #1b2433; }
.card.s { width: 256px; height: 172px; }
/* 手机等窄屏上中、大卡片收窄到屏幕宽度；画布按卡片实际尺寸建 */
.card.m { width: min(528px, calc(100vw - 40px)); height: 172px; }
.card.l { width: min(528px, calc(100vw - 40px)); height: 360px; }
@media (max-width: 600px) { .bar { position: static; } }
/* bare=1：只显示卡片（对比页用 iframe 嵌入） */
body.bare { background: transparent; min-height: 0; }
.bare .bar, .bare .stat, .bare #gal-title, .bare #gallery { display: none; }
.bare main { padding: 0; }
.bare .card.l, .bare .card.m { width: 100vw; }
canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.content { position: absolute; inset: 0; padding: 14px 16px; display: flex; flex-direction: column; text-shadow: 0 1px 2px rgba(0, 0, 0, .22); }
/* 顶部文字压在亮云上：跟着字形走的柔和暗晕 */
.city, .temp, .cond, .hilo { text-shadow: 0 1px 2px rgba(0, 0, 0, .28), 0 0 10px rgba(0, 0, 0, .3), 0 0 26px rgba(0, 0, 0, .22); }
.city { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.city svg { width: 11px; height: 11px; }
.temp { font-size: 46px; font-weight: 200; line-height: 1; letter-spacing: -1px; }
.cond { font-size: 13px; font-weight: 500; }
.hilo { font-size: 13px; font-weight: 500; }
.panel { border-radius: 14px; padding: 8px 10px; }
.row { display: flex; justify-content: space-between; }
.hour { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px; font-weight: 500; min-width: 32px; }
.hour .t { font-size: 11px; opacity: .85; }
.hour svg { width: 24px; height: 24px; }
.day { display: grid; grid-template-columns: 40px 28px 28px 1fr 28px; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; height: 25px; }
.day svg { width: 22px; height: 22px; }
.day .lo { text-align: right; opacity: .7; }
.day .hi { text-align: right; }
.track { position: relative; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, .2); overflow: hidden; }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.now-dot { position: absolute; top: -1px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .25); }
</style>
</head>
<body>
<div class="bar">
  <div class="group" id="g-cond"><span class="label">天气</span></div>
  <div class="group"><span class="label">时间</span><input type="range" id="hour" min="0" max="24" step="0.25" style="width:200px;accent-color:#e8ecf2"><span id="hour-out" style="min-width:44px"></span>
    <button class="chip" data-hour="6.7">日出</button><button class="chip" data-hour="13">白天</button><button class="chip" data-hour="17.7">黄昏</button><button class="chip" data-hour="22.5">夜里</button></div>
  <div class="group" id="g-size"><span class="label">尺寸</span></div>
  <div class="group" id="g-fps"><span class="label">帧率</span></div>
  <div class="group"><span class="label">文字</span><button class="chip" id="text"></button></div>
</div>
<main>
  <section class="stage" id="stage"></section>
  <h2 id="gal-title">全部天气（小卡片）</h2>
  <section class="gallery" id="gallery"></section>
</main>
<script src="tex2/manifest.js"></script>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const CONDITIONS = [
  { id: "clear", label: "晴", cov: 0, sun: 1 },
  { id: "partly", label: "少云", cov: 0.42, sun: 1, wind: 1 },
  { id: "cloudy", label: "多云", cov: 0.66, sun: 0.75, wind: 1.2 },
  { id: "overcast", label: "阴", cov: 0.95, sun: 0.35, gray: 1, wind: 0.8 },
  { id: "fog", label: "雾", cov: 0.8, sun: 0.45, gray: 0.9, fog: 1, wind: 0.4 },
  { id: "drizzle", label: "小雨", cov: 0.92, sun: 0.3, gray: 0.85, rain: 0.4, dark: 0.3, wind: 1 },
  { id: "rain", label: "大雨", cov: 1, sun: 0.18, gray: 1, rain: 1, heavy: 0.6, dark: 0.6, wind: 1.6 },
  { id: "storm", label: "雷阵雨", cov: 1, sun: 0.12, gray: 1, rain: 0.9, heavy: 0.8, storm: 1, dark: 0.75, wind: 2 },
  { id: "snow", label: "小雪", cov: 0.93, sun: 0.3, gray: 0.75, snow: 1, dark: 0.15, wind: 0.6 },
];
CONDITIONS.forEach((c) => (c.cover = c.cov));
const TUNE_SEED = Number(params.get("seed") || 0);
const SIZES = [{ id: "s", label: "小 2×2" }, { id: "m", label: "中 4×2" }, { id: "l", label: "大 4×4" }];
const FPS = [{ id: "30", label: "30" }, { id: "60", label: "60" }];
const state = {
  cond: params.get("cond") || "partly",
  hour: params.has("time") ? Number(params.get("time")) : 13,
  size: params.get("size") || "l",
  fps: params.get("fps") || "30",
  text: params.get("text") !== "0",
  gallery: params.get("gallery") !== "0",
};
const SUNRISE = 6.45, SUNSET = 17.95, MOON_PHASE = 0.32;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const condById = (id) => CONDITIONS.find((c) => c.id === id);
// 云贴图（实拍照片抠掉蓝天后只留亮度与透明度，横向无缝平铺）；full 表示整幅云层（不透明，阴雨天用）
// v=old：改之前的效果（旧贴图、旧配色、旧面板），并排对比用
const OLD = params.get("v") === "old";
// 新抠图只换了抠出来的三类（整幅的阴雨贴图没变）
const RETOUCHED = ["field", "cumulus", "bank"];
const TEX = Object.fromEntries(Object.entries(window.CLOUD_TEX || {}).map(([k, list]) => [k, list.map((s) => (OLD || !RETOUCHED.includes(k) ? s : s.replace("tex2/", "tex3/")))]));
if (params.get("bare") === "1") document.body.classList.add("bare");
// ofs：各层贴图的起始位置固定（对比页让改前改后的云在同一处）；不给就随机
const FIXED_OFS = params.has("ofs") ? Number(params.get("ofs")) : null;
// 每种天气的层（远到近）：贴图类别、贴图上下沿落在卡片的哪里（0 顶、1 底，可超出卡片）、横向缩放、速度（每秒移动贴图宽度的比例）、不透明度
const LAYERS = {
  clear: [],
  partly: [
    { kind: "field", top: 0.3, bottom: 0.8, scale: 1.0, speed: 0.003, alpha: 0.85 },
    { kind: "cumulus", top: -0.2, bottom: 0.5, scale: 1.0, speed: 0.006, alpha: 1 },
  ],
  cloudy: [
    { kind: "field", top: 0.05, bottom: 0.6, scale: 0.9, speed: 0.003, alpha: 0.9 },
    { kind: "bank", top: 0.3, bottom: 1.04, scale: 1.0, speed: 0.004, alpha: 1 },
    { kind: "cumulus", top: -0.3, bottom: 0.5, scale: 1.15, speed: 0.008, alpha: 1 },
  ],
  overcast: [{ kind: "overcast", full: true, top: -0.2, bottom: 1.2, speed: 0.003, alpha: 1 }],
  fog: [{ kind: "overcast", full: true, top: -0.2, bottom: 1.2, speed: 0.002, alpha: 1 }],
  drizzle: [{ kind: "overcast", full: true, top: -0.2, bottom: 1.2, speed: 0.004, alpha: 1 }],
  rain: [{ kind: "dark", full: true, top: -0.2, bottom: 1.2, speed: 0.005, alpha: 1 }],
  storm: [{ kind: "dark", full: true, top: -0.25, bottom: 1.25, speed: 0.007, alpha: 1 }],
  snow: [{ kind: "overcast", full: true, top: -0.2, bottom: 1.2, speed: 0.003, alpha: 1 }],
};
</script>
<script src="shared.js"></script>
<script>
"use strict";
// ================= 卡片内容：顶部信息 + 磨砂面板 =================
function contentHTML3(size, d, condLabel, condId) {
  const head = `<div class="city">${d.city}${ARROW}</div><div class="temp">${d.temp}°</div>`;
  const condLine = `<div class="cond">${condLabel}</div><div class="hilo">最高 ${d.hi}° 最低 ${d.lo}°</div>`;
  const hourCell = (h) => `<div class="hour"><span class="t">${h.label}</span>${icon(h.kind, h.night)}<span>${h.temp}°</span></div>`;
  if (size === "s") return `<div>${head}</div><div style="margin-top:auto">${condLine}</div>`;
  if (size === "m") return `<div style="display:flex;height:100%;gap:12px"><div style="display:flex;flex-direction:column;width:128px">${head}<div style="margin-top:auto">${condLine}</div></div><div class="panel" data-panel style="flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:center"><div class="row">${d.hours.slice(0, 6).map(hourCell).join("")}</div></div></div>`;
  const lo = Math.min(...d.days.map((x) => x.lo)), hi = Math.max(...d.days.map((x) => x.hi));
  const dayRow = (x, i) => { const left = ((x.lo - lo) / (hi - lo)) * 100, width = ((x.hi - x.lo) / (hi - lo)) * 100; const dot = i === 0 ? `<i class="now-dot" style="left:calc(${((d.temp - lo) / (hi - lo)) * 100}% - 3px)"></i>` : ""; return `<div class="day"><span>${x.label}</span><span style="display:flex;justify-content:center">${icon(x.kind, false)}</span><span class="lo">${x.lo}°</span><span class="track"><span class="fill" style="left:${left}%;width:${width}%;background:linear-gradient(90deg,${tempColor(x.lo)},${tempColor(x.hi)})"></span>${dot}</span><span class="hi">${x.hi}°</span></div>`; };
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;height:72px"><div>${head}</div><div style="text-align:right;margin-top:22px">${condLine}</div></div>
<div class="panel" data-panel style="margin-top:6px"><div class="row">${d.hours.slice(0, 7).map(hourCell).join("")}</div></div>
<div class="panel" data-panel style="margin-top:8px;flex:1;display:flex;flex-direction:column;justify-content:center">${d.days.map(dayRow).join("")}</div>`;
}


// ================= 着色器 =================
const VERT = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const HASH = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float remap(float v, float l0, float h0, float l1, float h1){ return l1 + (v - l0) * (h1 - l1) / (h0 - l0); }
`;
// 天空：实时渐变、太阳与月亮、星星；云贴图分层叠加（按太阳角度与时段重新打光，逆光时云边透亮，缓慢扰动显得有生气）；再叠雾、闪电、雨雪
const SKY_FS = `#version 300 es
precision highp float;
uniform sampler2D u_l0, u_l1, u_l2, u_l3;
uniform vec4 u_lp[4];   // 顶、底、缩放、不透明度
uniform vec4 u_lq[4];   // 速度、是否整幅、贴图宽高比、起点偏移
uniform int u_nl;
uniform vec2 u_res; uniform float u_dpr; uniform float u_time; uniform float u_aspect;
uniform vec3 u_top, u_mid, u_bot, u_sunCore, u_glow;
uniform vec2 u_sun, u_moon; uniform float u_sunVis, u_moonVis, u_moonPhase, u_stars;
uniform vec3 u_litCol, u_shadeCol;
uniform float u_back;   // 逆光强度：太阳在云后方附近时，云体变暗、薄处透亮
uniform float u_dark, u_rain, u_heavy, u_snow, u_fog, u_wind, u_flash; uniform vec3 u_fogCol;
uniform float u_v3, u_depth, u_ambSky;   // 新配色开关、云暗部保留多少（1 = 照片原样）、背阴面染多少天空色
out vec4 o;
${HASH}
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y); }
float fbm2(vec2 p){ float s = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 5; i++){ s += a * vn(p); p = m * p; a *= 0.5; } return s; }
// 贴图：亮度在 r、透明度在 a（整幅云层 a 恒为 1）；bias 取更粗的多级纹理层，相当于模糊
vec4 layerTex(int i, vec2 uv, float bias){ if (i == 0) return texture(u_l0, uv, bias); if (i == 1) return texture(u_l1, uv, bias); if (i == 2) return texture(u_l2, uv, bias); return texture(u_l3, uv, bias); }
float rainLayer(vec2 g, float cell, float len, float speed, float dens, float seed){
  vec2 s = vec2(g.x / cell, g.y / (cell * len) + u_time * speed);
  vec2 id = floor(s); vec2 f = fract(s);
  float on = step(1.0 - dens, hash12(id + seed));
  float xo = 0.25 + 0.5 * hash12(id + seed + 4.1);
  float y = fract(f.y + hash12(id + seed + 2.7));
  float line = smoothstep(0.9 / cell, 0.15 / cell, abs(f.x - xo));
  return on * line * smoothstep(0.0, 0.25, y) * (1.0 - smoothstep(0.25, 0.32, y));
}
float flake(vec2 g, float cell, float speed, float r, float soft, float seed){
  float yy = g.y + u_time * speed;
  vec2 p = vec2(g.x + sin(u_time * 0.7 + yy / cell * 1.9 + seed) * cell * 0.18 - u_time * speed * 0.2 * u_wind, yy) / cell;
  vec2 id = floor(p); vec2 f = fract(p) - 0.5;
  vec2 off = (hash22(id + seed) - 0.5) * 0.7;
  float rr = r * (0.6 + 0.7 * hash12(id + seed * 4.4));
  return step(0.35, hash12(id + seed * 1.7)) * smoothstep(rr, rr * (1.0 - soft), length(f - off) * cell);
}
void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = frag / u_res;
  vec2 g = frag / u_dpr;
  float y = 1.0 - uv.y;
  vec2 q = vec2(uv.x * u_aspect, y);
  vec3 col = y < 0.55 ? mix(u_top, u_mid, y / 0.55) : mix(u_mid, u_bot, (y - 0.55) / 0.45);
  vec3 skyBase = col;   // 这里的天空色（不含太阳光晕），用来给云的背阴面染色
  vec2 sp = vec2(u_sun.x * u_aspect, u_sun.y);
  float ds = length(q - sp);
  col += u_glow * u_sunVis * (0.4 * exp(-ds * 3.2) + 0.55 * exp(-ds * ds * 70.0));
  col = mix(col, u_sunCore * 1.15, smoothstep(0.032, 0.026, ds) * u_sunVis);
  if (u_stars > 0.0) {
    vec2 sg = g / 3.0; vec2 id = floor(sg); float h = hash12(id);
    if (h > 0.985) { vec2 off = hash22(id) - 0.5; float d = length(fract(sg) - 0.5 - off * 0.5) * 3.0; col += vec3(0.9, 0.94, 1.0) * smoothstep(1.1, 0.0, d) * (0.4 + 0.6 * hash12(id + 2.0)) * (0.6 + 0.4 * sin(u_time * (1.0 + 2.5 * hash12(id + 1.0)) + h * 50.0)) * u_stars * smoothstep(0.95, 0.4, y); }
  }
  if (u_moonVis > 0.0) {
    vec2 mp = vec2(u_moon.x * u_aspect, u_moon.y);
    vec2 md = (q - mp) / 0.042; float r2 = dot(md, md);
    if (r2 < 1.0) {
      vec3 nrm = vec3(md.x, -md.y, sqrt(1.0 - r2));
      float a = u_moonPhase * 6.28318;
      float lit = smoothstep(-0.04, 0.12, dot(nrm, normalize(vec3(sin(a), 0.15, -cos(a)))));
      float tex = 0.85 + 0.2 * fbm2(md * 3.0 + 4.0) - 0.2 * smoothstep(0.5, 0.7, fbm2(md * 1.6 + 9.0));
      col = mix(col, vec3(0.96, 0.95, 0.9) * tex * lit + vec3(0.04, 0.05, 0.07), smoothstep(1.0, 0.94, r2) * u_moonVis);
    }
    col += vec3(0.5, 0.56, 0.68) * u_moonVis * 0.2 * exp(-length(q - mp) * 9.0);
  }
  for (int i = 0; i < 4; i++) {
    if (i >= u_nl) break;
    vec4 lp = u_lp[i], lq = u_lq[i];
    bool full = lq.y > 0.5;
    float band = lp.y - lp.x;
    float v = (y - lp.x) / band;
    if (!full && (v < 0.0 || v > 1.0)) continue;
    float u = (uv.x * u_aspect / (band * lq.z)) / lp.z + u_time * lq.x + lq.w;
    vec2 tuv = vec2(u, clamp(v, 0.0, 1.0));
    // 极轻微的形变：云在慢慢变，但不能像液体一样流动
    tuv += (vec2(vn(tuv * vec2(3.0, 2.0) + u_time * 0.015), vn(tuv * vec2(3.0, 2.0) + vec2(7.0, 1.0) - u_time * 0.012)) - 0.5) * 0.0015;
    vec4 c = layerTex(i, tuv, 0.0);
    float thick = full ? 1.0 : layerTex(i, tuv, 3.0).a;   // 附近一圈的云量，当作厚度
    float a = c.a * lp.w * (full ? 1.0 : smoothstep(0.0, 0.06, v) * smoothstep(1.0, 0.92, v));
    float lum = c.r;
    vec3 front;
    if (u_v3 > 0.5 && !full) {
      // 照片是对着很深的蓝天拍的，云的暗部放到我们更亮的天上显得灰脏：整体提亮、保留明暗层次。
      // 背阴面受天光照，按这里的天空色染（白天偏蓝）；中性灰挨着饱和的蓝天会被看成发黄发褐，就是"油腻"的来源之一
      float L = 1.0 - (1.0 - lum) * u_depth;
      vec3 skyN = skyBase / max(max(skyBase.r, skyBase.g), max(skyBase.b, 1e-3));
      vec3 shade = dot(u_shadeCol, vec3(0.2126, 0.7152, 0.0722)) * mix(vec3(1.0), skyN, u_ambSky);
      front = L * mix(shade, u_litCol, smoothstep(0.35, 1.0, lum));
    } else {
      // 旧：照片的明暗原样保留，只换光的颜色：亮处主要受阳光，暗处主要受天光
      front = lum * mix(u_shadeCol, u_litCol, smoothstep(0.35, 1.0, lum));
    }
    // 逆光：离太阳越近越明显；云体略压暗，薄处透出太阳的颜色
    vec2 cq = vec2(uv.x * u_aspect, y);
    float back = u_back * exp(-length(cq - sp) * 3.5);     // 只有太阳正后方附近的云才明显逆光
    float tr = c.a * (1.0 - thick);
    vec3 cc = front * (1.0 - 0.25 * back) + u_glow * tr * 1.2 * back;
    cc += vec3(0.75, 0.8, 1.0) * u_flash * 0.9 * c.a;
    col = mix(col, cc, a);
  }
  if (u_fog > 0.0) {
    float f1 = fbm2(vec2(g.x / 160.0 + u_time * 0.02, g.y / 40.0));

  applyScene() {

  applyLayers() {

  // 一颗雨点砸到面板上：主水珠（先摊开再收回）+ 几颗溅出去的小水珠（飞出几像素后被表面粘住）
  impact(p, x, y, r, t) {

    this.drops.push({ x, y, r, born: t, panel: p, life: 4 + R() * 6, stick: R(), vy: 0 });

  }

  draw(now) {

// ================= 组装与循环 =================
const SIZE_PX = { s: [256, 172], m: [528, 172], l: [528, 360] };
const cards = new Set();
window.__cards = cards;
const gpu = { ns: 0, n: 0 };
const perf = { frames: 0, jsMs: 0, since: performance.now() };
let rafId = 0, last = 0;
function loop(now) {
  rafId = requestAnimationFrame(loop);
  if (state.fps === "30" && now - last < 1000 / 30 - 2) return;
  last = now;
  const s = performance.now();
  for (const c of cards) c.draw(now);
  perf.jsMs += performance.now() - s; perf.frames++;
}
function buildCard(size, condId, host) {
  const sc = scene(condId, state.hour);
  sc.c = condById(condId);
  const el = document.createElement("div");
  el.className = `card ${size}`;
  const canvas = document.createElement("canvas");
  canvas.className = "gl";
  el.appendChild(canvas);
  const content = document.createElement("div");
  content.className = "content";
  content.innerHTML = contentHTML3(size, sampleData(condId, state.hour), sc.c.label, condId);
  if (!state.text) content.style.visibility = "hidden";
  el.appendChild(content);
  host.appendChild(el);
  const box = el.getBoundingClientRect();
  const w = Math.round(box.width) || SIZE_PX[size][0], h = Math.round(box.height) || SIZE_PX[size][1];
  const rel = (p) => { const r = p.getBoundingClientRect(); return { x: r.left - box.left, y: r.top - box.top, w: r.width, h: r.height }; };
  const panels = [...content.querySelectorAll("[data-panel]")].map(rel);
  // 文字块按实际字形宽度量（行内元素），不要整行
  const texts = [...content.querySelectorAll(".city,.temp,.cond,.hilo")].map((t) => { const s = document.createElement("span"); s.append(...t.childNodes); t.append(s); const r = rel(s); return r; });
  try { cards.add(new WeatherTexCard(el, canvas, w, h, sc, panels, texts)); }
  catch (e) { console.error(e); el.insertAdjacentHTML("beforeend", `<pre style="position:absolute;inset:0;margin:0;padding:8px;font-size:10px;white-space:pre-wrap;color:#f88;overflow:auto;background:#000c">${String(e.message || e)}</pre>`); }
}
function render() {
  for (const c of cards) c.dispose();
  cards.clear();
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  const fig = document.createElement("figure");
  stage.appendChild(fig);
  buildCard(state.size, state.cond, fig);
  fig.insertAdjacentHTML("beforeend", `<p class="stat" id="stat"></p>`);
  const gal = document.getElementById("gallery");
  gal.innerHTML = "";
  document.getElementById("gal-title").hidden = !state.gallery;
  if (state.gallery) for (const c of CONDITIONS) { const f = document.createElement("figure"); gal.appendChild(f); buildCard("s", c.id, f); f.insertAdjacentHTML("beforeend", `<figcaption>${c.label}</figcaption>`); }
  if (!rafId) rafId = requestAnimationFrame(loop);
  syncControls();
  window.__ready = true;
}
setInterval(() => {
  const now = performance.now(), secs = (now - perf.since) / 1000;
  window.__perf = { fps: perf.frames / secs, jsMsPerFrame: perf.jsMs / Math.max(1, perf.frames), gpuMsPerFrame: gpu.n ? gpu.ns / gpu.n / 1e6 : null, cards: cards.size };
  const el = document.getElementById("stat");
  if (el) el.textContent = `每秒 ${Math.round(window.__perf.fps)} 帧；全部 ${cards.size} 张卡片每帧：脚本 ${window.__perf.jsMsPerFrame.toFixed(2)} ms` + (window.__perf.gpuMsPerFrame != null ? `，显卡 ${window.__perf.gpuMsPerFrame.toFixed(2)} ms` : "");
  perf.frames = 0; perf.jsMs = 0; perf.since = now; gpu.ns = 0; gpu.n = 0;
}, 2000);
window.__probeFps = (ms) => new Promise((resolve) => { let n = 0; const s = performance.now(); const tick = () => { n++; if (performance.now() - s < ms) requestAnimationFrame(tick); else resolve((n * 1000) / (performance.now() - s)); }; requestAnimationFrame(tick); });
function chipGroup(id, items, key) {
  const g = document.getElementById(id);
  for (const it of items) { const b = document.createElement("button"); b.className = "chip"; b.textContent = it.label; b.dataset.value = it.id; b.onclick = () => { state[key] = it.id; render(); }; g.appendChild(b); }
}
chipGroup("g-cond", CONDITIONS, "cond");
const hourEl = document.getElementById("hour");
hourEl.oninput = () => { state.hour = Number(hourEl.value); render(); };
document.querySelectorAll("[data-hour]").forEach((b) => (b.onclick = () => { state.hour = Number(b.dataset.hour); render(); }));
chipGroup("g-size", SIZES, "size");
chipGroup("g-fps", FPS, "fps");
document.getElementById("text").onclick = () => { state.text = !state.text; render(); };
function syncControls() {
  hourEl.value = String(state.hour);
  const hh = Math.floor(state.hour), mm = Math.round((state.hour - hh) * 60);
  document.getElementById("hour-out").textContent = `${String(hh % 24).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
  for (const [id, key] of [["g-cond", "cond"], ["g-size", "size"], ["g-fps", "fps"]]) document.getElementById(id).querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === state[key])));
  const tb = document.getElementById("text"); tb.textContent = state.text ? "显示" : "隐藏"; tb.setAttribute("aria-pressed", String(state.text));
}
render();
