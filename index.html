<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气卡片样稿</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: #e8ecf2;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: radial-gradient(1100px 620px at 18% 8%, #45566b 0%, transparent 60%), radial-gradient(900px 600px at 85% 90%, #3a3550 0%, transparent 55%), linear-gradient(160deg, #1b2430, #262f3d 45%, #12171f);
  background-attachment: fixed;
}
.bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 20px; background: rgba(16, 20, 27, .82); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, .08); font-size: 13px; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > .label { color: #9aa6b6; margin-right: 2px; }
.chip { border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .04); color: #dfe5ee; border-radius: 999px; padding: 4px 10px; font: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { background: #e8ecf2; color: #10141b; border-color: #e8ecf2; }
main { padding: 24px 20px 60px; }
.stage { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.stat { font-size: 12px; color: #8793a3; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
h2 { font-size: 15px; font-weight: 500; color: #c9d2de; margin: 36px 0 12px; }
.gallery { display: flex; flex-wrap: wrap; gap: 16px; }
figure { margin: 0; }
figcaption { font-size: 13px; color: #aab5c4; margin: 8px 0 0; }
.card { position: relative; overflow: hidden; border-radius: 24px; corner-shape: superellipse(1.2); isolation: isolate; color: #fff; background: #1b2433; }
.card.s { width: 256px; height: 172px; }
/* 手机等窄屏上中、大卡片收窄到屏幕宽度；画布按卡片实际尺寸建 */
.card.m { width: min(528px, calc(100vw - 40px)); height: 172px; }
.card.l { width: min(528px, calc(100vw - 40px)); height: 360px; }
@media (max-width: 600px) { .bar { position: static; } }
/* bare=1：只显示卡片（对比页用 iframe 嵌入） */
body.bare { background: transparent; min-height: 0; }
.bare .bar, .bare .stat, .bare #gal-title, .bare #gallery { display: none; }
.bare main { padding: 0; }
.bare .card.l, .bare .card.m { width: 100vw; }
canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.content { position: absolute; inset: 0; padding: 14px 16px; display: flex; flex-direction: column; text-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
.city, .temp, .cond, .hilo { text-shadow: 0 1px 2px rgba(0, 0, 0, .26), 0 0 10px rgba(0, 0, 0, .22), 0 0 24px rgba(0, 0, 0, .14); }
.city { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.city svg { width: 11px; height: 11px; }
.temp { font-size: 46px; font-weight: 200; line-height: 1; letter-spacing: -1px; }
.cond { font-size: 13px; font-weight: 500; }
.hilo { font-size: 13px; font-weight: 500; }
.panel { border-radius: 14px; padding: 8px 10px; }
.row { display: flex; justify-content: space-between; }
.hour { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px; font-weight: 500; min-width: 32px; }
.hour .t { font-size: 11px; opacity: .85; }
.hour svg { width: 24px; height: 24px; }
.day { display: grid; grid-template-columns: 40px 28px 28px 1fr 28px; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; height: 25px; }
.day svg { width: 22px; height: 22px; }
.day .lo { text-align: right; opacity: .7; }
.day .hi { text-align: right; }
.track { position: relative; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, .2); overflow: hidden; }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.now-dot { position: absolute; top: -1px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .25); }
</style>
</head>
<body>
<div class="bar">
  <div class="group" id="g-cond"><span class="label">天气</span></div>
  <div class="group"><span class="label">时间</span><input type="range" id="hour" min="0" max="24" step="0.25" style="width:200px;accent-color:#e8ecf2"><span id="hour-out" style="min-width:44px"></span>
    <button class="chip" data-hour="6.7">日出</button><button class="chip" data-hour="13">白天</button><button class="chip" data-hour="17.7">黄昏</button><button class="chip" data-hour="22.5">夜里</button></div>
  <div class="group" id="g-size"><span class="label">尺寸</span></div>
  <div class="group" id="g-fps"><span class="label">帧率</span></div>
  <div class="group"><span class="label">文字</span><button class="chip" id="text"></button></div>
</div>
<main>
  <section class="stage" id="stage"></section>
  <h2 id="gal-title">全部天气（小卡片）</h2>
  <section class="gallery" id="gallery"></section>
</main>
<script>
"use strict";
const params = new URLSearchParams(location.search);
window.__ov = {};
const num = (k, d) => (k in window.__ov ? window.__ov[k] : params.has(k) ? Number(params.get(k)) : d);
// cov：云量；gray：天空偏灰的程度；dark：压暗；sun：太阳光露出多少
const CONDITIONS = [
  { id: "clear", label: "晴", cov: 0, sun: 1 },
  { id: "partly", label: "少云", cov: 0.4, sun: 1, wind: 1 },
  { id: "cloudy", label: "多云", cov: 0.66, sun: 0.7, gray: 0.14, wind: 1.1 },
  { id: "overcast", label: "阴", cov: 0.95, sun: 0, gray: 1, wind: 0.8 },
  { id: "fog", label: "雾", cov: 0.8, sun: 0, gray: 0.9, fog: 1, wind: 0.4 },
  { id: "drizzle", label: "小雨", cov: 0.95, sun: 0, gray: 1, rain: 0.35, dark: 0.45, wind: 1 },
  { id: "rain", label: "大雨", cov: 1, sun: 0, gray: 1, rain: 1, heavy: 0.7, dark: 1, wind: 1.5 },
  { id: "storm", label: "雷阵雨", cov: 1, sun: 0, gray: 1, rain: 1, heavy: 1, storm: 1, dark: 1.25, wind: 2 },
  { id: "snow", label: "小雪", cov: 0.95, sun: 0, gray: 0.9, snow: 1, dark: 0.1, wind: 0.6 },
];
const SIZES = [{ id: "s", label: "小 2×2" }, { id: "m", label: "中 4×2" }, { id: "l", label: "大 4×4" }];
const FPS = [{ id: "30", label: "30" }, { id: "60", label: "60" }];
const state = {
  cond: params.get("cond") || "partly",
  hour: params.has("time") ? Number(params.get("time")) : 13,
  size: params.get("size") || "l",
  fps: params.get("fps") || "30",
  text: params.get("text") !== "0",
  gallery: params.get("gallery") !== "0",
};
const SUNRISE = 6.45, SUNSET = 17.95, MOON_PHASE = 0.32;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const condById = (id) => CONDITIONS.find((c) => c.id === id);
if (params.get("bare") === "1") document.body.classList.add("bare");
// seed：云图案的起始位置固定（两次打开云在同一处）；不给就随机
const SEED = params.has("seed") ? Number(params.get("seed")) : null;
// freeze：云停在这一秒不动（截图对比用）
const FREEZE = params.has("freeze") ? Number(params.get("freeze")) : null;
</script>
<script src="shared.js"></script>
<script>
"use strict";
// ================= 卡片内容：顶部信息 + 磨砂面板 =================
function contentHTML3(size, d, condLabel) {
  const head = `<div class="city">${d.city}${ARROW}</div><div class="temp">${d.temp}°</div>`;
  const condLine = `<div class="cond">${condLabel}</div><div class="hilo">最高 ${d.hi}° 最低 ${d.lo}°</div>`;
  const hourCell = (h) => `<div class="hour"><span class="t">${h.label}</span>${icon(h.kind, h.night)}<span>${h.temp}°</span></div>`;
  if (size === "s") return `<div>${head}</div><div style="margin-top:auto">${condLine}</div>`;
  if (size === "m") return `<div style="display:flex;height:100%;gap:12px"><div style="display:flex;flex-direction:column;width:128px">${head}<div style="margin-top:auto">${condLine}</div></div><div class="panel" data-panel style="flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:center"><div class="row">${d.hours.slice(0, 6).map(hourCell).join("")}</div></div></div>`;
  const lo = Math.min(...d.days.map((x) => x.lo)), hi = Math.max(...d.days.map((x) => x.hi));
  const dayRow = (x, i) => { const left = ((x.lo - lo) / (hi - lo)) * 100, width = ((x.hi - x.lo) / (hi - lo)) * 100; const dot = i === 0 ? `<i class="now-dot" style="left:calc(${((d.temp - lo) / (hi - lo)) * 100}% - 3px)"></i>` : ""; return `<div class="day"><span>${x.label}</span><span style="display:flex;justify-content:center">${icon(x.kind, false)}</span><span class="lo">${x.lo}°</span><span class="track"><span class="fill" style="left:${left}%;width:${width}%;background:linear-gradient(90deg,${tempColor(x.lo)},${tempColor(x.hi)})"></span>${dot}</span><span class="hi">${x.hi}°</span></div>`; };
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;height:72px"><div>${head}</div><div style="text-align:right;margin-top:22px">${condLine}</div></div>
<div class="panel" data-panel style="margin-top:6px"><div class="row">${d.hours.slice(0, 7).map(hourCell).join("")}</div></div>
<div class="panel" data-panel style="margin-top:8px;flex:1;display:flex;flex-direction:column;justify-content:center">${d.days.map(dayRow).join("")}</div>`;
}

// ================= 噪声贴图：整页只算一次，各卡片共用 =================
// 四个通道都能无缝平铺：R 平滑起伏（云的大形）、G 鼓包（云边的一团团）、B 细的平滑起伏、A 细的鼓包（两者用来把云边啃碎）
const NOISE_N = 256;
function makeNoise(N) {
  const im = Math.imul;
  const h2 = (x, y, s) => { let h = im(x, 374761393) ^ im(y, 668265263) ^ im(s, 1274126177); h = im(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const chan = [0, 1, 2, 3].map(() => new Float32Array(N * N));
  function perlin(dst, basePer, octs, seed) {
    let amp = 1;
    for (let o = 0; o < octs; o++, amp *= 0.5) {
      const per = basePer << o, gx = new Float32Array(per * per), gy = new Float32Array(per * per);
      for (let i = 0; i < per * per; i++) { const a = h2(i % per, (i / per) | 0, seed + o * 13) * 6.2831853; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
      const f = per / N;
      for (let y = 0; y < N; y++) {
        const py = (y + 0.5) * f, yi = Math.floor(py), yf = py - yi, v = yf * yf * yf * (yf * (yf * 6 - 15) + 10), y0 = (yi % per) * per, y1 = ((yi + 1) % per) * per;
        for (let x = 0; x < N; x++) {
          const px = (x + 0.5) * f, xi = Math.floor(px), xf = px - xi, u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), x0 = xi % per, x1 = (xi + 1) % per;
          const a = gx[y0 + x0] * xf + gy[y0 + x0] * yf, b = gx[y0 + x1] * (xf - 1) + gy[y0 + x1] * yf, c = gx[y1 + x0] * xf + gy[y1 + x0] * (yf - 1), d = gx[y1 + x1] * (xf - 1) + gy[y1 + x1] * (yf - 1);
          dst[y * N + x] += amp * (a + (b - a) * u + (c + (d - c) * u - (a + (b - a) * u)) * v);
        }
      }
    }
  }
  function worley(dst, basePer, octs, seed) {
    let amp = 1;
    for (let o = 0; o < octs; o++, amp *= 0.5) {
      const per = basePer << o, fx = new Float32Array(per * per), fy = new Float32Array(per * per);
      for (let i = 0; i < per * per; i++) { fx[i] = h2(i % per, (i / per) | 0, seed + o * 7); fy[i] = h2(i % per, (i / per) | 0, seed + o * 7 + 101); }
      const f = per / N;
      for (let y = 0; y < N; y++) {
        const py = (y + 0.5) * f, yi = Math.floor(py);
        for (let x = 0; x < N; x++) {
          const px = (x + 0.5) * f, xi = Math.floor(px);
          let m = 9;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const cx = xi + dx, cy = yi + dy, k = (((cy % per) + per) % per) * per + (((cx % per) + per) % per);
            const ex = cx + fx[k] - px, ey = cy + fy[k] - py, dd = ex * ex + ey * ey;
            if (dd < m) m = dd;
          }
          dst[y * N + x] += amp * (1 - Math.min(1, Math.sqrt(m) * 1.12));
        }
      }
    }
  }
  perlin(chan[0], 4, 5, 11); worley(chan[1], 5, 3, 23); perlin(chan[2], 12, 3, 37); worley(chan[3], 12, 3, 53);
  const out = new Uint8Array(N * N * 4);
  chan.forEach((c, k) => { let lo = Infinity, hi = -Infinity; for (const v of c) { if (v < lo) lo = v; if (v > hi) hi = v; } for (let i = 0; i < N * N; i++) out[i * 4 + k] = Math.round(((c[i] - lo) / (hi - lo)) * 255); });
  return out;
}
const noiseT0 = performance.now();
const NOISE = makeNoise(NOISE_N);
window.__noiseMs = performance.now() - noiseT0;

// ================= 着色器 =================
const VERT = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const HASH = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
`;
// 天空：渐变 + 画面外的太阳洒进来的光 + 星月 + 程序生成的云（按太阳方向打光）+ 雾 + 雪花
// 画面当作抬头看天的相机：上边仰角高（云近、看着大），下边接近地平线（云远、小，融进雾霭）
const SKY_FS = `#version 300 es
precision highp float;
uniform sampler2D u_noise;
uniform vec2 u_res; uniform float u_time, u_aspect, u_px;   // u_px：这张贴图一个像素合多少 CSS 像素
uniform vec3 u_top, u_mid, u_bot;                           // 天空三段色（sRGB）
uniform vec3 u_cam; uniform float u_dth;                     // 相机：sin 俯仰、cos 俯仰、焦距；一个像素的张角
uniform vec2 u_sun; uniform vec3 u_sunCol, u_skyGlow; uniform float u_glowK, u_halo, u_ghost, u_gs;   // 太阳锚点（x 以卡片高为单位，y 0 顶 1 底，可在画面外）
uniform vec3 u_lit, u_amb; uniform float u_hazeK, u_fwdK;   // 云的受光色、环境光色（线性）；远处融进天色的快慢；朝太阳一侧薄云透亮的强度
uniform vec4 u_LA[3], u_LB[3], u_LC[3], u_LD[3]; uniform int u_nl;
uniform vec2 u_wind; uniform float u_seed, u_jit, u_vig, u_bump;
uniform float u_stars; uniform vec3 u_moon; uniform float u_moonPhase;
uniform float u_fog; uniform vec3 u_fogCol;
uniform float u_flash; uniform vec2 u_flashAt;
uniform float u_snow, u_snowWind;
out vec4 o;
${HASH}
const mat2 R1 = mat2(0.8, -0.6, 0.6, 0.8);
const mat2 R2 = mat2(0.28, -0.96, 0.96, 0.28);
vec3 rayDir(vec2 q){
  vec3 dc = normalize(vec3((q.x - 0.5 * u_aspect) * 2.0, (0.5 - q.y) * 2.0, u_cam.z));
  return vec3(dc.x, dc.y * u_cam.y + dc.z * u_cam.x, -dc.y * u_cam.x + dc.z * u_cam.y);
}
// 噪声贴图按算好的层级取样（在分支和循环里取样时不能靠自动推算层级）
float shapeAt(vec2 p, float billow, float lod){ vec4 n = textureLod(u_noise, p, lod); return n.r - (0.5 - n.g) * billow * 0.7; }
float amountAt(vec2 p, float th, float soft, float billow, float lod){ return clamp((shapeAt(p, billow, lod) - th) / soft, 0.0, 1.0); }
// 太阳洒进画面的光随距离的衰减（天空和云共用）
float sunGlow(float r){ return 0.95 * exp(-r * r * 24.0) + 0.4 * exp(-r * 3.6); }
// 立体云里某一处的浓度：m 是这一处云的"量"（0～1），h 是在云层里的高度（0 底 1 顶）。平底、圆顶，顶上是毛边
float rhoAt(float m, float h){
  float top = pow(m, 0.62), bot = 0.16 * (1.0 - m);
  return smoothstep(0.0, 0.34, top - h) * smoothstep(-0.02, 0.12, h - bot);
}
// 一层云：返回预乘颜色与不透明度。D.w > 0 是有厚度的立体云（沿视线穿过云层取几个点）；否则是一层薄云
vec4 cloudLayer(int i, vec3 rd, vec2 q, vec3 sd, vec3 sky){
  vec4 A = u_LA[i], B = u_LB[i], C = u_LC[i], D = u_LD[i];
  float ry = max(rd.y, 0.04);
  vec2 P = rd.xz / ry;                                      // 视线落在云底所在平面（高度 1）的哪里
  float dist = 1.0 / ry;
  vec2 st = vec2(A.x / B.x, A.x);                           // 沿风向（x）拉长
  vec2 mv = u_wind * u_time * B.w;
  vec2 off = u_seed * vec2(3.1, 1.7) + float(i) * 0.37 - mv;
  float lod = max(log2(u_dth * 256.0 * dist * A.x / sqrt(ry)), 0.0);
  vec2 p = P * st + off;
  float big = textureLod(u_noise, R1 * p * 0.19 + mv * 0.05 + 0.31, max(lod - 2.4, 0.0)).r;
  vec2 wv = (textureLod(u_noise, R2 * p * 0.37 + mv * 0.1 + 0.77, max(lod - 1.4, 0.0)).gb - 0.5) * B.y;
  float fade = smoothstep(C.z, C.w, q.y);                   // 画面往下云量收敛
  float th = A.y + (0.5 - big) * 0.24 + fade * D.x;
  float sr = length(q - u_sun) * u_gs;
  float glow = u_glowK * u_fwdK * sunGlow(sr);
  float hz = 1.0 - exp(-max(dist - 1.3, 0.0) * u_hazeK);    // 越远越融进天色
  vec3 fl = vec3(0.62, 0.7, 1.0) * u_flash * exp(-dot(q - u_flashAt, q - u_flashAt) * 2.2);
  // 细节：把云边扯出毛絮（先扭一下取样位置），再啃掉一些；另取一点算朝太阳方向的起伏，给云体一点凹凸的明暗
  vec2 Ps = sd.xz / max(sd.y, 0.04);
  vec2 l2 = normalize(Ps - P + 1e-5) * st;
  vec2 dq = R2 * p * D.y - mv * 0.14;
  float dlod = lod + log2(D.y) - 0.3;
  vec4 dn = textureLod(u_noise, dq, dlod);
  wv += (dn.ba - 0.5) * D.z * B.z / D.y;
  float ero = (dn.b * 0.55 + dn.a * 0.45) * B.z;
  float bump = (dn.a - textureLod(u_noise, dq + R2 * l2 * 0.03 * D.y / A.x, dlod).a) * u_bump;
  if (D.w > 0.0) {
    float Hc = D.w;
    const int N = 14;
    float jit = 0.5 + u_jit * (fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) - 0.5);
    float T = 1.0; vec3 acc = vec3(0.0);
    float dsK = A.w * 30.0 * Hc / (float(N) * max(rd.y, 0.2));
    for (int k = 0; k < N; k++) {
      float h = (float(k) + jit) / float(N);
      vec2 pp = P * (1.0 + Hc * h) * st + off + wv;
      float m = amountAt(pp, th, A.z, C.x, lod);
      float rho = rhoAt(m, h);
      if (rho > 0.002) {
        rho = clamp(rho - ero * (1.0 - 0.8 * rho), 0.0, 1.0);
        // 朝太阳方向取两点，估计阳光到这里之前被云挡了多少
        float s1 = 0.3 * Hc, s2 = 0.85 * Hc;
        float o1 = rhoAt(amountAt(pp + sd.xz * s1 * st, th, A.z, C.x, lod), h + sd.y * s1 / Hc) * step(h + sd.y * s1 / Hc, 1.0);
        float o2 = rhoAt(amountAt(pp + sd.xz * s2 * st, th, A.z, C.x, lod + 0.7), h + sd.y * s2 / Hc) * step(h + sd.y * s2 / Hc, 1.0);
        float tau = (o1 * 0.45 + o2 * 0.55 + rho * 0.25) * C.y;

        if (dx * dx + dy * dy < (a.r + b.r) ** 2 * 0.7) { const big = a.r >= b.r ? a : b, small = big === a ? b : a; big.r = Math.sqrt(big.r * big.r + small.r * small.r); big.vy = Math.max(big.vy, small.vy); big.life = Math.max(big.life, small.life); small.r = 0; }
      }
    }
    this.drops = next.filter((d) => d.r > 0).slice(-900);
    // ---------- 积雪 ----------
    const SW = this.snowW, rows = this.snowRows;
    for (let row = 0; row < rows; row++) {
      if (!(row < this.panels.length || row === 3)) continue;
      const base = row * SW, maxH = row === 3 ? 1 : 0.62;
      if (snow > 0) {
        let n = snow * dt * (row === 3 ? 40 : 28);
        while (R() < n) { n -= 1; const x = Math.floor(R() * SW), w = 2 + Math.floor(R() * 4), amt = 0.004 + R() * 0.006; for (let k = -w; k <= w; k++) { const i = x + k; if (i >= 0 && i < SW) this.snowData[base + i] = Math.min(maxH, this.snowData[base + i] + amt * (1 - (k / (w + 1)) ** 2)); } }
      } else {
        for (let i = 0; i < SW; i++) this.snowData[base + i] = Math.max(0, this.snowData[base + i] - dt * 0.004);
      }
      for (let it = 0; it < 2; it++) for (let i = 1; i < SW; i++) {
        const a = base + i - 1, b = base + i, diff = this.snowData[a] - this.snowData[b], lim = 0.012;
        if (Math.abs(diff) > lim) { const m = (Math.abs(diff) - lim) * 0.5 * Math.sign(diff); this.snowData[a] -= m; this.snowData[b] += m; }
      }
    }
    for (let i = 0; i < this.snowData.length; i++) this.snowBytes[i] = Math.round(clamp(this.snowData[i]) * 255);
  }
  draw(now) {
    const gl = this.gl, c = this.sc.c;
    const t = now / 1000;
    const dt = this.lastT == null ? 0.016 : Math.min(0.1, t - this.lastT);
    this.lastT = t;
    this.pt = (this.pt ?? 0) + dt / SLOWMO;
    this.step(dt / SLOWMO, this.pt);
    let q = null;
    if (this.timer && this.pending.length < 4) { q = gl.createQuery(); gl.beginQuery(this.timer.TIME_ELAPSED_EXT, q); }
    let flash = 0, flashAt = this.flashAt ?? [0.7, 0.2];
    if (c.storm) {
      const cyc = t / 5.7, ci = Math.floor(cyc), ph = cyc - ci, h = (x) => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      const on = h(ci * 3.17) > 0.3 ? 1 : 0;
      flash = ((ph > 0.5 && ph < 0.53 ? 1 - (ph - 0.5) / 0.03 : 0) + (ph > 0.56 && ph < 0.61 ? 0.8 * (1 - (ph - 0.56) / 0.05) : 0)) * on;
      flashAt = this.flashAt = [(this.cssW / this.cssH) * (0.2 + 0.6 * h(ci * 1.3)), 0.05 + 0.25 * h(ci * 2.1)];
    }
    this.flashNow = flash;
    gl.bindVertexArray(this.vao);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.noise);
    gl.activeTexture(gl.TEXTURE0);
    // 1. 天空与云（可以比屏幕粗、比每帧少画：云动得慢）
    const skyDue = !SKY_HZ || flash > 0 || this.hadFlash || (c.snow ?? 0) > 0 || t - this.lastSky >= 1 / SKY_HZ - 0.004;
    if (skyDue) {
      this.lastSky = t; this.hadFlash = flash > 0;
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.sky.fbo);
      gl.viewport(0, 0, this.sw, this.sh);
      gl.useProgram(this.pSky.p);
      gl.uniform1f(this.pSky.u("time"), FREEZE ?? t); gl.uniform1f(this.pSky.u("flash"), flash); gl.uniform2fv(this.pSky.u("flashAt"), flashAt);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindTexture(gl.TEXTURE_2D, this.sky.tex); gl.generateMipmap(gl.TEXTURE_2D);
    }
    // 2. 面板与积雪
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.W, this.H);
    gl.useProgram(this.pFinal.p);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.snowTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.snowW, this.snowRows, gl.RED, gl.UNSIGNED_BYTE, this.snowBytes);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.sky.tex);
    gl.uniform1f(this.pFinal.u("time"), t); gl.uniform1f(this.pFinal.u("snowAmt"), (c.snow ?? 0) > 0 || this.snowBytes.some((b) => b > 0) ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    // 3. 雨丝与水花
    const fs = this.frameStreaks ?? [], n = Math.min(this.MAXL, fs.length + this.sparks.length);
    if (n) {
      const L = this.lineData; let k = 0;
      for (const s of fs) { if (k >= n) break; const lx = s.len * (s.vx / s.vy); L.set([s.x - lx, s.y - s.len, s.x, s.y, s.w, s.a], k++ * 6); }
      for (const p of this.sparks) { if (k >= n) break; const fade = 1 - p.age / p.life, bl = p.flat ? 0 : 0.018; L.set(p.flat ? [p.x - 2.2, p.y, p.x + 2.2, p.y, 0.8, p.a * fade] : [p.x - p.vx * bl, p.y - p.vy * bl, p.x, p.y, p.r * 2, p.a * Math.min(1, fade * 2)], k++ * 6); }
      gl.bindVertexArray(this.lvao);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.linst); gl.bufferSubData(gl.ARRAY_BUFFER, 0, L, 0, k * 6);
      gl.useProgram(this.pLine.p);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, k);
    }
    // 4. 面板表面的水珠
    if (this.drops.length) {
      const arr = new Float32Array(this.drops.length * 4);
      this.drops.forEach((d, i) => arr.set([d.x, d.y, d.r, d.sat ? 1 : spreadAt(this.pt - d.born)], i * 4));
      gl.bindVertexArray(this.dvao);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.inst); gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
      gl.useProgram(this.pDrop.p);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.drops.length);
    }
    gl.disable(gl.BLEND);
    if (q) { gl.endQuery(this.timer.TIME_ELAPSED_EXT); this.pending.push(q); }
    while (this.pending.length && gl.getQueryParameter(this.pending[0], gl.QUERY_RESULT_AVAILABLE)) {
      const done = this.pending.shift();
      if (!gl.getParameter(this.timer.GPU_DISJOINT_EXT)) { gpu.ns += gl.getQueryParameter(done, gl.QUERY_RESULT); gpu.n++; }
      gl.deleteQuery(done);
    }
  }
  dispose() { this.disposed = true; this.gl.getExtension("WEBGL_lose_context")?.loseContext(); }
}

// ================= 组装与循环 =================
const SIZE_PX = { s: [256, 172], m: [528, 172], l: [528, 360] };
const cards = new Set();
window.__cards = cards;
const gpu = { ns: 0, n: 0 };
const perf = { frames: 0, jsMs: 0, since: performance.now() };
let rafId = 0, last = 0;
function loop(now) {
  rafId = requestAnimationFrame(loop);
  if (state.fps === "30" && now - last < 1000 / 30 - 2) return;
  last = now;
  const s = performance.now();
  for (const c of cards) c.draw(now);
  perf.jsMs += performance.now() - s; perf.frames++;
}
function buildCard(size, condId, host, hour = state.hour) {
  const el = document.createElement("div");
  el.className = `card ${size}`;
  const canvas = document.createElement("canvas");
  canvas.className = "gl";
  el.appendChild(canvas);
  const content = document.createElement("div");
  content.className = "content";
  content.innerHTML = contentHTML3(size, sampleData(condId, hour), condById(condId).label);
  if (!state.text) content.style.visibility = "hidden";
  el.appendChild(content);
  host.appendChild(el);
  const box = el.getBoundingClientRect();
  const w = Math.round(box.width) || SIZE_PX[size][0], h = Math.round(box.height) || SIZE_PX[size][1];
  const rel = (p) => { const r = p.getBoundingClientRect(); return { x: r.left - box.left, y: r.top - box.top, w: r.width, h: r.height }; };
  const panels = [...content.querySelectorAll("[data-panel]")].map(rel);
  const sc = scene2(condId, hour, size, w, h);
  try { cards.add(new SkyCard(el, canvas, w, h, sc, panels, size)); }
  catch (e) { console.error(e); el.insertAdjacentHTML("beforeend", `<pre style="position:absolute;inset:0;margin:0;padding:8px;font-size:10px;white-space:pre-wrap;color:#f88;overflow:auto;background:#000c">${String(e.message || e)}</pre>`); }
}
// sheet=partly@13,cloudy@17.7：一次并排画多张（自己对比用）
const SHEET = params.get("sheet");
function render() {
  for (const c of cards) c.dispose();
  cards.clear();
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  const VARY = params.get("vary");
  if (VARY) {
    const [key, vals] = VARY.split(":");
    for (const v of vals.split("|")) { window.__ov = { [key]: Number(v) }; const fig = document.createElement("figure"); stage.appendChild(fig); buildCard(state.size, state.cond, fig); fig.insertAdjacentHTML("beforeend", `<figcaption>${key} = ${v}</figcaption>`); }
    window.__ov = {};
  } else if (SHEET) {
    for (const item of SHEET.split(",")) { const [cond, time] = item.split("@"); const fig = document.createElement("figure"); stage.appendChild(fig); buildCard(state.size, cond, fig, Number(time ?? state.hour)); fig.insertAdjacentHTML("beforeend", `<figcaption>${condById(cond).label} · ${time ?? state.hour} 时</figcaption>`); }
  } else {
    const fig = document.createElement("figure");
    stage.appendChild(fig);
    buildCard(state.size, state.cond, fig);
    fig.insertAdjacentHTML("beforeend", `<p class="stat" id="stat"></p>`);
  }
  const gal = document.getElementById("gallery");
  gal.innerHTML = "";
  document.getElementById("gal-title").hidden = !state.gallery;
  if (state.gallery) for (const c of CONDITIONS) { const f = document.createElement("figure"); gal.appendChild(f); buildCard("s", c.id, f); f.insertAdjacentHTML("beforeend", `<figcaption>${c.label}</figcaption>`); }
  if (!rafId) rafId = requestAnimationFrame(loop);
  syncControls();
  window.__ready = true;
}
setInterval(() => {
  const now = performance.now(), secs = (now - perf.since) / 1000;
  window.__perf = { fps: perf.frames / secs, jsMsPerFrame: perf.jsMs / Math.max(1, perf.frames), gpuMsPerFrame: gpu.n ? gpu.ns / gpu.n / 1e6 : null, cards: cards.size, noiseMs: window.__noiseMs };
  const el = document.getElementById("stat");
  if (el) el.textContent = `每秒 ${Math.round(window.__perf.fps)} 帧；全部 ${cards.size} 张卡片每帧：脚本 ${window.__perf.jsMsPerFrame.toFixed(2)} ms` + (window.__perf.gpuMsPerFrame != null ? `，显卡 ${window.__perf.gpuMsPerFrame.toFixed(2)} ms` : "");
  perf.frames = 0; perf.jsMs = 0; perf.since = now; gpu.ns = 0; gpu.n = 0;
}, 2000);
function chipGroup(id, items, key) {
  const g = document.getElementById(id);
  for (const it of items) { const b = document.createElement("button"); b.className = "chip"; b.textContent = it.label; b.dataset.value = it.id; b.onclick = () => { state[key] = it.id; render(); }; g.appendChild(b); }
}
chipGroup("g-cond", CONDITIONS, "cond");
const hourEl = document.getElementById("hour");
hourEl.oninput = () => { state.hour = Number(hourEl.value); render(); };
document.querySelectorAll("[data-hour]").forEach((b) => (b.onclick = () => { state.hour = Number(b.dataset.hour); render(); }));
chipGroup("g-size", SIZES, "size");
chipGroup("g-fps", FPS, "fps");
document.getElementById("text").onclick = () => { state.text = !state.text; render(); };
function syncControls() {
  hourEl.value = String(state.hour);
  const hh = Math.floor(state.hour), mm = Math.round((state.hour - hh) * 60);
  document.getElementById("hour-out").textContent = `${String(hh % 24).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
  for (const [id, key] of [["g-cond", "cond"], ["g-size", "size"], ["g-fps", "fps"]]) document.getElementById(id).querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === state[key])));
  const tb = document.getElementById("text"); tb.textContent = state.text ? "显示" : "隐藏"; tb.setAttribute("aria-pressed", String(state.text));
}
render();
