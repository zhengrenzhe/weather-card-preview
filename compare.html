<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气卡片：上一版和这一版</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #151a22; color: #e8ecf2; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
header { padding: 18px 20px 4px; max-width: 1120px; }
h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
p { margin: 0 0 8px; color: #aab5c4; font-size: 13px; line-height: 1.7; }
a { color: #9ec5ff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px 16px; }
.chip { border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .04); color: #dfe5ee; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: #e8ecf2; color: #10141b; border-color: #e8ecf2; }
.pair { display: flex; flex-wrap: wrap; gap: 20px; padding: 0 20px 40px; }
figure { margin: 0; flex: 1 1 340px; max-width: 528px; }
figcaption { font-size: 14px; font-weight: 500; color: #c9d2de; margin: 0 0 8px; }
iframe { display: block; width: 100%; height: 360px; border: 0; border-radius: 24px; background: #1b2433; }
</style>
</head>
<body>
<header>
  <h1>天气卡片：上一版和这一版</h1>
  <p>两张卡片分别是上一版和这一版。这一版整个换了画法：云不再用照片，改成程序生成的小朵薄云，边缘是毛絮，按太阳的方向打光；太阳移到了卡片之外，只留洒进来的一片柔光；下雨时雨丝落到第一排信息栏的顶边会溅起水花。</p>
  <p>想单独看这一版、切换天气、时间和卡片大小，打开 <a href="./">样稿首页</a>。</p>
</header>
<div class="chips" id="chips"></div>
<section class="pair">
  <figure><figcaption>上一版（照片贴图）</figcaption><iframe id="before" title="上一版" loading="eager"></iframe></figure>
  <figure><figcaption>这一版</figcaption><iframe id="after" title="这一版" loading="eager"></iframe></figure>
</section>
<script>
"use strict";
// 对比的场景：天气与时刻。两版的云不是同一套，位置不对应
const SCENES = [
  { label: "少云 · 正午", q: "cond=partly&time=13" },
  { label: "多云 · 正午", q: "cond=cloudy&time=13" },
  { label: "晴 · 正午", q: "cond=clear&time=13" },
  { label: "多云 · 黄昏", q: "cond=cloudy&time=17.7" },
  { label: "阴", q: "cond=overcast&time=13" },
  { label: "大雨", q: "cond=rain&time=13" },
  { label: "少云 · 夜里", q: "cond=partly&time=22.5" },
];
const chips = document.getElementById("chips");
function show(i) {
  const s = SCENES[i];
  document.getElementById("before").src = `photo.html?${s.q}&size=l&gallery=0&bare=1&ofs=0.3`;
  document.getElementById("after").src = `index.html?${s.q}&size=l&gallery=0&bare=1&seed=6`;
  chips.querySelectorAll(".chip").forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)));
}
SCENES.forEach((s, i) => { const b = document.createElement("button"); b.className = "chip"; b.textContent = s.label; b.onclick = () => show(i); chips.appendChild(b); });
show(0);
</script>
</body>
</html>
