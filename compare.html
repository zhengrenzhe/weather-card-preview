<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云的改前改后</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #151a22; color: #e8ecf2; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
header { padding: 18px 20px 4px; max-width: 1120px; }
h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
p { margin: 0 0 8px; color: #aab5c4; font-size: 13px; line-height: 1.7; }
a { color: #9ec5ff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px 16px; }
.chip { border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .04); color: #dfe5ee; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: #e8ecf2; color: #10141b; border-color: #e8ecf2; }
.pair { display: flex; flex-wrap: wrap; gap: 20px; padding: 0 20px 40px; }
figure { margin: 0; flex: 1 1 340px; max-width: 528px; }
figcaption { font-size: 14px; font-weight: 500; color: #c9d2de; margin: 0 0 8px; }
iframe { display: block; width: 100%; height: 360px; border: 0; border-radius: 24px; background: #1b2433; }
</style>
</head>
<body>
<header>
  <h1>云的改前改后</h1>
  <p>两张卡片分别是改之前和改之后，云的位置相同。改了三处：抠图不再把薄云压成实心团块，去掉了云边的灰色描边；正午阳光从奶油色改成白色，云的暗部带一点天空的蓝；面板改成大半径磨砂，按大片的平均亮度整体压暗，玻璃后面的白云不再变成灰团。</p>
  <p>想单独看改后的效果、切换天气和时间，打开 <a href="./">样稿首页</a>。</p>
</header>
<div class="chips" id="chips"></div>
<section class="pair">
  <figure><figcaption>改前</figcaption><iframe id="before" title="改前" loading="eager"></iframe></figure>
  <figure><figcaption>改后</figcaption><iframe id="after" title="改后" loading="eager"></iframe></figure>
</section>
<script>
"use strict";
// 对比的场景：天气、时刻、贴图起始位置（两边相同，云在同一处）
const SCENES = [
  { label: "多云 · 正午", q: "cond=cloudy&time=13", ofs: 0.12 },
  { label: "少云 · 正午", q: "cond=partly&time=13", ofs: 0.55 },
  { label: "多云 · 黄昏", q: "cond=cloudy&time=17.7", ofs: 0.3 },
  { label: "多云 · 日出", q: "cond=cloudy&time=6.7", ofs: 0.71 },
  { label: "阴", q: "cond=overcast&time=13", ofs: 0.4 },
  { label: "大雨", q: "cond=rain&time=13", ofs: 0.2 },
];
const chips = document.getElementById("chips");
function show(i) {
  const s = SCENES[i];
  const base = `index.html?${s.q}&size=l&gallery=0&bare=1&ofs=${s.ofs}`;
  document.getElementById("before").src = `${base}&v=old`;
  document.getElementById("after").src = base;
  chips.querySelectorAll(".chip").forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)));
}
SCENES.forEach((s, i) => { const b = document.createElement("button"); b.className = "chip"; b.textContent = s.label; b.onclick = () => show(i); chips.appendChild(b); });
show(0);
</script>
</body>
</html>
